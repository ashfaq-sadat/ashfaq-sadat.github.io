name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
  # Redeploy after the weekly Scholar update commits new numbers
  # (commits made by the workflow token do not trigger push events).
  workflow_run:
    workflows: ["Update Google Scholar metrics"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
