name: Update Google Scholar metrics

on:
  schedule:
    - cron: "17 3 * * 1"   # every Monday, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch metrics
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python .github/scripts/update_scholar.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/data/scholar.json; then
            echo "No change."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/data/scholar.json
            git commit -m "Update Google Scholar metrics"
            git push
          fi
